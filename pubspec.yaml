name: kumbh_suraksha
description: A Flutter app for Kumbh Mela safety and crowd management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client
  http: ^1.2.0

  # Map packages
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # UI packages
  google_fonts: ^6.1.0
  
  # Icons
  lucide_icons: ^0.257.0
  
  # Utilities
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
